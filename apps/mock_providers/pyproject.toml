[project]
name = "maplelaunch-mock-providers"
version = "0.1.0"
description = "Simulated PAN / GST / bank / risk verification providers and merchant-ID service for MapleLaunch"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pgserver>=0.1.4"]
