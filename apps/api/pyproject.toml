[project]
name = "maplelaunch-api"
version = "0.1.0"
description = "MapleLaunch: autonomous merchant onboarding API (FastAPI + LangGraph)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "psycopg[binary,pool]>=3.2",
  "langgraph>=0.6",
  "langgraph-checkpoint-postgres>=2.0",
  "langchain-core>=0.3",
  "langchain-google-genai>=2.0",
  "langchain-groq>=0.2",
  "httpx>=0.27",
  "tenacity>=9.0",
  "rapidfuzz>=3.9",
  "cryptography>=43",
  "pyjwt[crypto]>=2.9",
  "pypdfium2>=4.30",
  "pillow>=10.4",
  "python-multipart>=0.0.9",
  "structlog>=24.4",
  "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "pgserver>=0.1.4",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]  # `uv run pytest` (as in CI) does not add the project folder to the import path

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "SIM", "RUF"]
# B008: FastAPI's Depends()/File() defaults are the intended pattern.
ignore = ["B008", "RUF001", "RUF002", "RUF003"]
