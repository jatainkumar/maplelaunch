# Render free web services sleep after ~15 min idle. This pings the API every 10 minutes between 08:30 and 20:30
# IST so reviewers don't hit a cold start; while awake, the API keeps the provider service warm too. Twelve hours a
# day for two services stays inside Render's 750 free instance-hours per month.
# Set the repository variable API_URL (e.g. https://maplelaunch-api.onrender.com) to enable it.
name: Keep demo warm
on:
  schedule:
    - cron: "*/10 3-14 * * *"
  workflow_dispatch:

jobs:
  ping:
    if: ${{ vars.API_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 "${{ vars.API_URL }}/healthz" || true
